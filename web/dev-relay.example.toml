# Copy to dev-relay.toml (gitignored) and point its [[world]] at a real
# MUCK. Each [[world]] is a world file with an id, and the page's world
# too. See docs/web-relay.md.

# How long a connection is held after the page goes away (short_hold:
# after its tab closed), and how much is buffered for it meanwhile (the
# defaults):
# hold = "24h"
# short_hold = "10m"
# max_buffer_mb = 4
# max_total_buffer_mb = 256

# Push notifications while away (see docs/web-relay.md for the key):
# vapid_key = "vapid.pem"
# push_contact = "https://muck.example.org"

[[world]]
id = "fm"
host = "muck.example.org"
port = 8899
# For a TLS world: tls = true, and tls_trust = "ca" or pin = "sha256:…".

[[world.characters]]
id = "kit"
name = "Kit"
