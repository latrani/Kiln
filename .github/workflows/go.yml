# Tests the Go code on macOS and Windows, where Kiln also ships but
# keychain, paths and renames were never tested; Linux is web.yml's. The
# desktop app is tested and packaged on all three, natively. On PRs and
# pushes to main that touch Go, the desktop app or the page it embeds.
name: go

on:
  push:
    branches: [main]
  pull_request:
    paths: ["**.go", "go.mod", "go.sum", "web/go.mod", "web/go.sum", "desktop/**", "web/ui/**", ".github/workflows/go.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false # one OS's failure shouldn't hide the other's
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Root tests
        run: go test ./...
      - name: Web, native
        working-directory: web
        run: go test ./...

  # The same builds as release.yml's desktop job, at version 0.0.0.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal, so no ARCH. The Taskfile sets macOS 13 for its own
          # builds; the tests get the same, or ld warns that Wails' C
          # targets another macOS than Go's objects do.
          - os: macos-latest
            cgo-flags: -mmacosx-version-min=13.0
          # The Taskfile's ARCH defaults to the runner's.
          - os: windows-latest
            arch: amd64
          - os: ubuntu-latest
            arch: amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on Windows
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install wails3
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.32
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install GTK4 and WebKitGTK 6.0 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Check for NSIS (Windows)
        if: runner.os == 'Windows'
        run: command -v makensis && makensis -VERSION
      - name: Test
        env:
          CGO_CFLAGS: ${{ matrix.cgo-flags }}
          CGO_LDFLAGS: ${{ matrix.cgo-flags }}
        run: go test ./...
      - name: Package
        run: wails3 package ${{ matrix.arch && format('ARCH={0}', matrix.arch) || '' }}
      - name: List the packages
        run: ls -la bin
