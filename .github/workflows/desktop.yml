# Tests and packages the desktop app natively on macOS, Windows and
# Linux, on PRs and pushes to main that touch it, the page it embeds
# (web/ui), or the Kiln module it builds on (Go, and the files that
# module embeds under internal/).
name: desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", "web/ui/**", "**.go", "go.mod", "go.sum", "internal/**", ".github/actions/desktop-setup/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "web/ui/**", "**.go", "go.mod", "go.sum", "internal/**", ".github/actions/desktop-setup/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

jobs:
  # The same builds as release.yml's desktop job, at a prerelease
  # version, so a cut that Windows' version fields reject fails here.
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal, so no ARCH. The Taskfile sets macOS 13 for its own
          # builds; the tests get the same, or ld warns that Wails' C
          # targets another macOS than Go's objects do.
          - os: macos-latest
            cgo-flags: -mmacosx-version-min=13.0
            # Wails' cgo files each link -lobjc; ld says so on every build.
            ld-flags: -mmacosx-version-min=13.0 -Wl,-no_warn_duplicate_libraries
          # The Taskfile's ARCH defaults to the runner's.
          - os: windows-latest
            arch: amd64
          - os: ubuntu-latest
            arch: amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on Windows
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: ./.github/actions/desktop-setup
      - name: Test
        env:
          CGO_CFLAGS: ${{ matrix.cgo-flags }}
          CGO_LDFLAGS: ${{ matrix.ld-flags }}
        run: go test ./...
      - name: Package
        run: wails3 package VERSION=0.0.0-ci ${{ matrix.arch && format('ARCH={0}', matrix.arch) || '' }}
      - name: List the packages
        run: ls -la bin
