# Builds and uploads release binaries when a version tag (v1.2.3) is
# pushed. The release is created as a draft for review; see README.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload files to it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
