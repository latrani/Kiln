# Kiln's built-in theme, kiln. To change the look, set the roles you want
# different in themes/default.toml in Kiln's config folder, which says
# extends = "kiln". Colors are "#rrggbb", a [palette] name, a terminal
# color (red, bright-blue, ...), or "default" for the terminal's own.
# [palette.light] (and [palette.dark]) replace [palette] entries on a
# light (or dark) terminal.
# Styles take fg, bg, bold, faint, italic, underline and reverse. A role
# inherits from the role before its last dot: link.hover starts from link.
#
# The color names it uses are every theme's: Catppuccin's accents
# (catppuccin.toml, catppuccin.mauve) and Kiln's glazes (glaze.toml,
# glaze.celadon-ink).

[ui]
"sidebar"              = { fg = "glaze.celadon-ink" }
"sidebar.char"         = { bold = true }
"sidebar.connecting"   = { bold = true }
"sidebar.disconnected" = { bold = true }
"sidebar.active"       = { reverse = true, bold = true }
"sidebar.priority"     = { fg = "catppuccin.yellow", bold = true }
"sidebar.add"          = { fg = "glaze.celadon-bright", bg = "glaze.celadon-deep", bold = true }
"sidebar.action"       = { fg = "glaze.celadon-bright", bg = "glaze.celadon-deep", bold = true }
"sidebar.more"         = { fg = "glaze.celadon-mid" }

"picker"                = { fg = "glaze.kaki-ink" }
"picker.world"          = { bold = true }
"picker.world.selected" = { reverse = true }
"picker.selected"       = { reverse = true }
"picker.add"            = { fg = "glaze.kaki-bright", bg = "glaze.kaki-deep" }

"divider"     = { fg = "glaze.celadon-line" }
"rule.input"  = { fg = "glaze.gold-line" }
"rule.form"   = { fg = "glaze.kaki-line" }
"rule.status" = { fg = "glaze.cobalt-line" }

"scrollback.day"         = { faint = true }
"scrollback.history_end" = { faint = true }
"scrollback.loading"     = { faint = true }
"scrollback.echo"        = { faint = true }
"scrollback.sys"         = { faint = true }
"scrollback.pill"        = { reverse = true }
"scrollback.selection"   = { reverse = true }
"scrollback.inactive"    = { faint = true }
"scrollback.empty"       = { faint = true }
"scrollback.overview"    = { bold = true }
"scrollback.rule"        = { faint = true }
"link"                   = { underline = true }
"link.hover"             = { fg = "bright-blue" }

"input"            = { fg = "glaze.gold-ink" }
"input.hint"       = { fg = "glaze.gold-mid" }
"input.over_limit" = { fg = "glaze.alarm", bg = "glaze.alarm-deep" }
"input.selection"  = { reverse = true }

"status"           = { fg = "glaze.cobalt-ink" }
"status.log"       = { fg = "glaze.cobalt-bright", bg = "glaze.cobalt-deep", bold = true }
"status.log.on"    = { reverse = true }
"status.filter"    = { fg = "glaze.cobalt-bright", bg = "glaze.cobalt-deep", bold = true }
"status.filter.on" = { reverse = true }
"status.error"     = { fg = "red" }

"status.presence"         = { fg = "glaze.cobalt-ink" }
"status.presence.here"    = { fg = "glaze.cobalt-mid" }
"status.presence.away"    = { fg = "catppuccin.yellow", bold = true }
"status.presence.unknown" = { italic = true }

"form"        = { fg = "glaze.kaki-ink" }
"form.label"  = { fg = "glaze.kaki-mid" }
"form.hint"   = { fg = "glaze.kaki-mid" }
"form.error"  = { fg = "red" }
"form.focus"  = { reverse = true }
"form.title"  = { bold = true }
"form.button"           = { fg = "glaze.kaki-bright", bg = "glaze.kaki-deep", bold = true }
"form.button.secondary" = { bold = false }

"log.time"           = { faint = true }
"log.cursor"         = { reverse = true }
"log.find"           = { reverse = true }
"log.day"            = { faint = true }
"log.loading"        = { faint = true }
"log.bar"            = { fg = "glaze.gold-ink" }
"log.bar.hints"      = { fg = "glaze.gold-mid" }

"filter"           = { fg = "glaze.cobalt-ink" }
"filter.item"      = { bold = true }
"filter.selected"  = { reverse = true }
"filter.button"    = { fg = "glaze.cobalt-mid" }
"filter.button.on" = { fg = "glaze.cobalt-bright", bg = "glaze.cobalt-deep", bold = true }
"filter.add"       = { fg = "glaze.cobalt-bright", bg = "glaze.cobalt-deep", bold = true }
"filter.more"      = { fg = "glaze.cobalt-mid" }

"export" = { fg = "#d8d8d8", bg = "#1b1b1f" }

# How lines with Kiln's own tags are drawn: self (lines that mention
# you) and highlight (/highlight). A pack styles the tags it gives lines
# (see packs/fuzzball.toml), naming colors every theme has
# (catppuccin.peach, catppuccin.mauve); a theme can restyle any tag. A
# tag inherits up its slashes, as a role does up its dots. scope =
# "match" styles only the text the tag's pattern matched.
[tags]
"self"       = { bold = true }
"highlight"  = { fg = "catppuccin.yellow", bold = true, scope = "match" }
