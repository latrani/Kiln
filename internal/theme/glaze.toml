# Kiln's glazes, for its own parts of the screen, and alarm: color
# names every theme has as glaze.celadon-ink and so on, beside
# Catppuccin's (catppuccin.toml).
#
# Each part of the screen has a glaze: celadon for the sidebar, cobalt
# for the statusline, gold for the input and kaki for forms. Its lines
# and text are pale tints of it; its buttons sit on a deep one.

[palette]
celadon-deep   = "#0b3d3b"
celadon-mid    = "#8bb1b0"
celadon-line   = "#a2cdcc"
celadon-ink    = "#a0e3e1"
celadon-bright = "#c0edeb"

cobalt-deep   = "#0b1b3d"
cobalt-mid    = "#8b98b1"
cobalt-line   = "#a2b0cd"
cobalt-ink    = "#a0b7e3"
cobalt-bright = "#c0cfed"

gold-mid  = "#b1a68b"
gold-line = "#cdc1a2"
gold-ink  = "#e3d0a0"

kaki-deep   = "#3d200b"
kaki-mid    = "#b19c8b"
kaki-line   = "#cdb5a2"
kaki-ink    = "#e3bda0"
kaki-bright = "#edd3c0"

alarm      = "#d92626"
alarm-deep = "#2a0909"

# The same glazes for a light terminal: dark inks for text and lines,
# pale tints under chips, and alarm dark enough for paper.
[palette.light]
celadon-deep   = "#bce6e4"
celadon-mid    = "#629391"
celadon-line   = "#74b4b2"
celadon-ink    = "#1d726f"
celadon-bright = "#125452"

cobalt-deep   = "#bccae6"
cobalt-mid    = "#627293"
cobalt-line   = "#7489b4"
cobalt-ink    = "#1d3972"
cobalt-bright = "#122854"

gold-mid  = "#938562"
gold-line = "#b4a274"
gold-ink  = "#725a1d"

kaki-deep   = "#e6cebc"
kaki-mid    = "#937762"
kaki-line   = "#b49074"
kaki-ink    = "#72421d"
kaki-bright = "#542f12"

alarm      = "#a51d1d"
alarm-deep = "#f9dcdc"
