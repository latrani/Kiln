# Every string Kiln shows a person. Edit freely, then run
#   go generate ./internal/str
# Placeholders: {name}, or {name:%q} with a fmt verb; {{ and }} are literal
# braces. A table of plural forms (one, other, …) picks by {n}.

# Between parts of the statusline, the log header, and a form and its hint;
# the spaces are part of it.
separator = " · "

[session]
not_connected = "not connected"
sent_not_logged = "sent, but not logged: {err}"
quit = "disconnected (quit)"
connect_failed = "connect failed: {err}"
connect_failed_retrying = "connect failed: {err}; retrying in {delay}"
connected = "connected to {host}:{port}"
closed_by_server = "closed by server"
disconnected = "disconnected ({reason})"
disconnected_retrying = "disconnected ({reason}); retrying in {delay}"
no_saved_password = "no saved password for {world}/{char}"

[conn]
no_certificate = "server sent no certificate"
reading_known_hosts = "reading known_hosts: {err}"
bad_fingerprint = "malformed sha256 fingerprint {fp:%q}"
cert_changed = "certificate for {host} changed: pinned {pinned}, got {got}"
relay_not_listed = "this world isn't on the web relay's list"
relay_needs_tls = "this world only works over TLS on the web"
relay_too_many = "too many connections from your address; close one and try again"
relay_unreachable = "the relay couldn't reach this world: {reason}"
relay_down = "couldn't reach the web relay"
relay_dropped = "lost the connection to the web relay"

[logstore]
no_tab = "logstore: no tab in {line:%q}"
bad_prefix = "logstore: bad prefix {prefix:%q}"
bad_time = "logstore: bad time: {err}"
bad_direction = "logstore: bad direction {dir:%q}"
reading = "logstore: reading {file}: {err}"

[notify]
bad_level = 'notify must be "all", "first", "attention" or "none"'
