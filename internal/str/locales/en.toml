unknown_time_code = "unknown time code %{code:%c}"

[secrets]
store_none = 'password_store is "none"'

[cli]
usage = """
usage:
  kiln [--no-autoconnect]
  kiln tail <world> <char>
  kiln passwd <world> <char>
  kiln trust <world> <fingerprint>
  kiln theme show <theme>
  kiln version"""
error = "kiln: {err}"
press_enter = "press Enter to close"
no_character_define = "no character {world}/{char}"
