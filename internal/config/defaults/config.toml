# Kiln global config. World files live in worlds/<id>.toml.

# Where saved passwords go: "keychain", "file" (~/.local/share/kiln/passwords.json,
# readable only by you; for systems without a keychain) or "none" (never save).
# password_store = "keychain"

# Where logs go and what they're called (Kiln adds .log): strftime codes
# (%Y %m %d %H %M %S …) for when the session started, and {world}, {char}
# (the character's id) and {name}.
# log_dir = "~/.local/share/kiln/logs/{world}/{char}"
# log_name = "%Y-%m-%d %H%M%S {char}"

# Log-mode exports: the folder, the file name ({date}, {time}, {world},
# {name}, strftime codes) and the format Enter picks ("plain", "ansi" or
# "html"; unset asks).
# export_dir = "~/Documents/Kiln Scenes"
# export_name = "{date} {time} {world} {name}"
# export_format = "html"

[defaults]
max_line_bytes = 2047   # Fuzzball's limit; override per world if yours differs
newline_mode = "batch"  # "batch": each line is its own command; "flatten": join with spaces
local_echo = false      # true: show what you send in the scrollback (it is always logged)
