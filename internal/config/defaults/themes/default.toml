# Your theme. It starts as Kiln's built-in one and changes only what you
# set here; Kiln picks up changes as you save. To see every role and
# color the built-in sets: kiln theme show kiln
#
# Colors are "#rrggbb", a [palette] name, a terminal color (red,
# bright-blue, ...), or "default" for the terminal's own. Styles take fg,
# bg, bold, faint, italic, underline and reverse; a tag's can also say
# scope = "match" to color only the text its rule matched.

