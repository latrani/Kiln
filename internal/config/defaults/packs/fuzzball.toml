# Starter rules for Fuzzball MUCKs (built-in commands plus the stock
# cmd-page and cmd-whisper programs). Servers customize these heavily;
# edit freely. The pack says what lines are and which ones are a
# priority; how they look is up to the theme's [tags].

priority = ["page/in", "whisper/in", "self"]

# Whispers, like pages below: "whisper/in" to you, "whisper/out" your own.
[[classify]]
tags = ["whisper", "whisper/in"]
pattern = '^\S+ whispers,? "'

[[classify]]
tags = ["whisper", "whisper/out"]
pattern = '^You whisper, '

# Pages carry "page" plus "page/in" (to you) or "page/out" (your own,
# as the server echoes them), so a "page" filter shows both sides of a
# conversation while only what you receive is a priority.
[[classify]]
tags = ["page", "page/in"]
pattern = '^\S+ pages( from [^:]+)?: '

[[classify]]
tags = ["page", "page/in"]
pattern = '^\S+ pages, ".*" to '

[[classify]]
tags = ["page", "page/in"]
pattern = '^In a page-pose to '

[[classify]]
tags = ["page", "page/in"]
pattern = '^You sense that \S+ is paging you'

[[classify]]
tags = ["page", "page/out"]
pattern = '^You page(-pose)?, '
