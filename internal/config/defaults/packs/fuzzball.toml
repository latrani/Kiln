# Starter rules for Fuzzball MUCKs (built-in commands plus the stock
# cmd-page and cmd-whisper programs). Servers customize these heavily;
# edit freely.

[[classify]]
tag = "say"
pattern = '^(You say|\S+ says), "'

[[classify]]
tag = "whisper"
pattern = '^\S+ whispers,? "'

# Pages carry "page" plus "page/in" (to you) or "page/out" (your own,
# as the server echoes them), so a "page" filter shows both sides of a
# conversation while the highlight below colors only what you receive.
[[classify]]
tags = ["page", "page/in"]
pattern = '^\S+ pages( from [^:]+)?: '

[[classify]]
tags = ["page", "page/in"]
pattern = '^\S+ pages, ".*" to '

[[classify]]
tags = ["page", "page/in"]
pattern = '^In a page-pose to '

[[classify]]
tags = ["page", "page/in"]
pattern = '^You sense that \S+ is paging you'

[[classify]]
tags = ["page", "page/out"]
pattern = '^You page(-pose)?, '

[[highlight]]
match = { tags = ["page/in"] }
style = { fg = "#ff9f43", bold = true }
attention = true

[[highlight]]
match = { tags = ["whisper"] }
style = { fg = "#c39bd3", italic = true }
attention = true

[[highlight]]
match = { tags = ["self"] }
style = { bold = true }
attention = true
