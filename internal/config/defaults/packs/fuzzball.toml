# Starter rules for Fuzzball MUCKs (built-in commands plus the stock
# cmd-page, cmd-whisper and cmd-watchfor programs). Servers customize
# these heavily; edit freely. The pack says what lines are and which
# ones are a priority; how they look is up to the theme's [tags].

priority = ["page/in", "whisper/in", "watchfor/connect", "self"]

[[classify]]
tags = ["whisper", "whisper/in"]
pattern = '^\S+ whispers,? "'

[[classify]]
tags = ["whisper", "whisper/out"]
pattern = '^You whisper, '

[[classify]]
tags = ["page", "page/in"]
pattern = '^\S+ pages( from [^:]+)?: '

[[classify]]
tags = ["page", "page/in"]
pattern = '^\S+ pages, ".*" to '

[[classify]]
tags = ["page", "page/in"]
pattern = '^In a page-pose to '

[[classify]]
tags = ["page", "page/in"]
pattern = '^You sense that \S+ is paging you'

[[classify]]
tags = ["page", "page/out"]
pattern = '^You page(-pose)?, '

[[classify]]
tags = ["watchfor", "watchfor/connect"]
pattern = '^Somewhere on the muck, \S+ (has )?(re)?connected\.'

[[classify]]
tags = ["watchfor", "watchfor/disconnect"]
pattern = '^Somewhere on the muck, \S+ (has )?disconnected\.'

[[classify]]
tag = "system"
pattern = '^##'

[[classify]]
tag = "ooc"
pattern = '<OOC>|\[OOC\]|\(OOC\)'

# How these lines look, in the theme's colors. A theme, world or
# character can restyle any of them; a tag inherits up its slashes, so
# page/in starts from page.
[tags]
"whisper"  = { fg = "catppuccin.sky", bold = true }
"page"     = { fg = "catppuccin.blue", bold = true }
"watchfor" = { fg = "catppuccin.maroon", bold = true }
"system"   = { fg = "catppuccin.green", faint = true }
"ooc"   = { fg = "catppuccin.mauve", faint = true }
